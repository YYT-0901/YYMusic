server:
  domain: localhost:8091
  port: 8091
  servlet:
    context-path: /api
spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:mysql://localhost:3306/yymusic?allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2B8&characterEncoding=utf8
    username: root
    password: MySQL@4869
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      database: 0
      host: 127.0.0.1
      port: 6379
      jedis:
        pool:
          max-active: 20
          max-wait: -1
          max-idle: 10
          min-idle: 0
      timeout: 2000
mybatis:
  configuration:
    map-underscore-to-camel-case: true
#项目目录
project:
  folder: D:\\STUDY\\beijing_universiti_folder8\\source_code\\yymusic-backend\\
  #日志级别配置
log:
  root:
  level: debug
#管理员账号
admin:
  account: admin
  password: admin123

springdoc:
  api-docs:
    enabled: true                  # 启用/禁用API文档的访问
    path: /v3/api-docs             # 设置API文档的访问路径
  swagger-ui:
    path: /swagger-ui.html         # 设置Swagger UI的访问路径
    disable-swagger-default-url: true
    display-request-duration: true # 显示请求持续时间
  packages-to-scan: com.yymusic.controller # 指定要扫描的包

# OSS 配置
oss:
  type: minio  # 存储类型: minio, remote, local
  # MinIO 配置
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: yymusic
    custom-domain:
  # Remote (FTP) 配置
  remote:
    ftp-host: localhost
    ftp-port: 21
    ftp-username: ftpuser
    ftp-password: ftppassword
    # 文件存储路径 请注意下，mac用户请使用 /Users/your-username/your-path/，否则会有权限问题，windows用户请使用 D:/your-path/
    storage-path: /yymusic/
  # Local 本地存储配置
  local:
    storage-path: D:\\STUDY\\beijing_universiti_folder8\\source_code\\yymusic-backend\\file
    domain: http://localhost:8090/api/file/getResource?filePath=

yymusic:
  async:
    background-executor:
      core-pool-size: 4
      max-pool-size: 4
      queue-capacity: 16
      keep-alive-seconds: 60
    comfy-create-executor:
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 200
      keep-alive-seconds: 60
