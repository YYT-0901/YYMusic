# 微信支付
pay:
  wechat:
    appid: xxx  #微信支付应用ID
    mchid: xxx  #微信支付商户ID
    serialNo: xxx  #微信支付证书编号
    apiclientKeypath: xxx/apiclient_key.pem  #微信证书文件
    apiV3key: xxx  #apiv3 签名密钥
