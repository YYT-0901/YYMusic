server:
  port: 8090
  servlet:
    context-path: /api
spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:mysql://localhost:3306/easymusic?allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2B8&characterEncoding=utf8
    username: root
    password: MySQL@4869
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      database: 0
      host: localhost
      port: 6379
      timeout: 5000 # 增加超时时间，避免短超时导致连接断开
      lettuce:
        pool:
          max-active: 10 # 减少最大活跃连接，避免连接数过多
          max-wait: 2000ms # 明确单位，避免默认值异常
          max-idle: 5
          min-idle: 2
          time-between-eviction-runs: 60s # 延长空闲检查间隔
          test-while-idle: true # 空闲时检测连接可用性
          test-on-borrow: false # 借用时不检测（减少性能损耗，依赖idle检测）
          test-on-return: false
  task:
    scheduling:
      pool:
        size: 5
  ai:
    openai:
      api-key: sk-bJRqYDa5GWT2QyluR8DKvd1EJenAqAMNbC75xIIZfGFgFtVc  # 填入你的 API Key
      base-url: https://api.chatanywhere.tech
      chat.options:
        model: deepseek-r1:7b
    ollama:
      base-url: http://127.0.0.1:11434
      chat:
        model: qwen3:8b
        options:
          num-ctx: 4096
          model: mxbai-embed-large

